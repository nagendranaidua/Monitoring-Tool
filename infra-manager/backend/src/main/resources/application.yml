server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=infra_schema
    username: postgres
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:YourSuperSecretKeyForJWTTokenGenerationMinimum256Bits!!}
    expiration-ms: 86400000  # 24 hours
  encryption:
    master-key: ${ENCRYPTION_KEY:ChangeThisMasterKeyInProduction!!}
  ssh:
    connection-timeout-ms: 10000
    command-timeout-ms: 30000

# CORS
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000

logging:
  level:
    com.inframanager: DEBUG
    org.springframework.security: INFO
